databases:
  - name: google-skills-db
    plan: free # change for production

services:
  - type: web
    name: google-skills-api
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: google-skills-db
          property: connectionString
      - key: CORS_ALLOW_ORIGINS
        value: https://REPLACE_WITH_FRONTEND_URL
      - key: COURSE_WORKBOOK_PATH
        value: /app/data/course.xlsx
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "10"
      - key: DB_POOL_TIMEOUT
        value: "30"
      - key: DB_POOL_RECYCLE
        value: "1800"

  - type: worker
    name: google-skills-scheduler
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile.worker
    dockerContext: .
    # Keep exactly one instance to avoid duplicate/overlapping scrape operations.
    numInstances: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: google-skills-db
          property: connectionString
      - key: COURSE_WORKBOOK_PATH
        value: /app/data/course.xlsx
      - key: SCRAPE_INTERVAL_MINUTES
        value: "60"
      - key: SCRAPE_CONCURRENCY
        value: "3"
      - key: SCRAPE_RUN_INITIAL
        value: "false"
      - key: SCRAPE_LAUNCH_TIMEOUT_MS
        value: "30000"
      - key: SCRAPE_NAVIGATION_TIMEOUT_MS
        value: "60000"
      - key: SCRAPE_OPERATION_TIMEOUT_MS
        value: "120000"
      - key: SCRAPE_SHUTDOWN_GRACE_SECONDS
        value: "180"
      - key: LOG_LEVEL
        value: INFO
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "5"
      - key: DB_POOL_TIMEOUT
        value: "30"
      - key: DB_POOL_RECYCLE
        value: "1800"

  - type: web
    name: google-skills-frontend
    runtime: docker
    plan: starter
    dockerfilePath: ./frontend/website/Dockerfile
    dockerContext: ./frontend/website
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://REPLACE_WITH_API_URL
