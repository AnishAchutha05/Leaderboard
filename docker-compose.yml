
services:
  postgres:
    image: postgres:16
    container_name: google-skills-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: google_skills_tracker
      POSTGRES_USER: tracker_user
      POSTGRES_PASSWORD: tracker_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker_user -d google_skills_tracker"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
